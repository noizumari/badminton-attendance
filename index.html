      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .error-message {
      font-size: 0.9rem;

    }

    .toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 100;
      max-width: 90%;

    }

    .refresh-button {
      width: 100%;

    }
  </style>

  </div>

  <!-- トースト -->

  <div
    id="toast"
    class="toast">
  </div>

  <script>

    // ==========================================
    // 設定
    // ==========================================

    const LIFF_ID = "2011243364-Jx2wZwK4"; // あなたの LIFF ID
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyzLUn1pulwe7WwjtQtBF5mUOwPZuEm20AjD42oUrL-KiYWyfE2_UZvdkReY8j1v2PG/exec"; // あなたの GAS WebアプリURL (/exec)


    // ==========================================
    // 状態管理
    // ==========================================

    let idToken = '';

    let targetDate = '';

    let isSubmitting = false;


    // ==========================================
    // 初期化
    // ==========================================

    window.onload = async function() {

      try {

        // --------------------------------------
        // URLから開催日を取得
        // --------------------------------------

        const urlParams =
          new URLSearchParams(
            window.location.search
          );


        if (
          urlParams.has('date') &&
          /^\d{4}-\d{2}-\d{2}$/.test(
            urlParams.get('date')
          )
        ) {

          targetDate =
            urlParams.get('date');

        } else {

          targetDate =
            getDefaultTargetDate();
        }


        // --------------------------------------
        // LIFF初期化
        // --------------------------------------

        await liff.init({
          liffId: LIFF_ID
        });


        // --------------------------------------
        // LINEログイン確認
        // --------------------------------------

        if (!liff.isLoggedIn()) {

          liff.login({
            redirectUri:
              window.location.href
          });

          return;
        }


        // --------------------------------------
        // ID Token取得
        // --------------------------------------

        idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            'LINEのユーザー認証情報を取得できませんでした。'
          );
        }


        // --------------------------------------
        // データ取得
        // --------------------------------------

        await loadData();


      } catch (error) {

        console.error(
          '初期化エラー:',
          error
        );

        showError(
          getUserFriendlyErrorMessage(error)
        );
      }

    };


    // ==========================================
    // データ取得
    // ==========================================

    async function loadData() {

      document.getElementById(
        'event-date'
      ).innerText =
        '開催日: ' + targetDate;


      try {

        const response =
          await fetch(
            GAS_API_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain'
              },

              body: JSON.stringify({

                action:
                  'getSummary',

                date:
                  targetDate,

                idToken:
                  idToken

              })
            }
          );


        // --------------------------------------
        // HTTPエラー
        // --------------------------------------

        if (!response.ok) {

          throw new Error(
            'サーバーとの通信に失敗しました。'
          );
        }


        // --------------------------------------
        // JSON解析
        // --------------------------------------

        const data =
          await response.json();


        if (!data) {

          throw new Error(
            'サーバーから正しいデータを取得できませんでした。'
          );
        }


        // --------------------------------------
        // GAS側エラー
        // --------------------------------------

        if (!data.success) {

          throw new Error(
            data.message ||
            'データの取得に失敗しました。'
          );
        }


        // --------------------------------------
        // UI更新
        // --------------------------------------

        renderUI(data);


      } catch (error) {

        console.error(
          'データ取得エラー:',
          error
        );

        showError(
          getUserFriendlyErrorMessage(error)
        );
      }

    }


    // ==========================================
    // 出欠登録
    // ==========================================

    async function onVote(
      status,
      count
    ) {

      if (isSubmitting) {
        return;
      }


      isSubmitting = true;


      setVoteButtonsDisabled(
        true
      );


      showToast(
        '回答を送信中...'
      );


      try {

        const response =
          await fetch(
            GAS_API_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain'
              },

              body: JSON.stringify({

                action:
                  'submitAttendance',

                date:
                  targetDate,

                idToken:
                  idToken,

                status:
                  status,

                count:
                  count

              })
            }
          );


        // --------------------------------------
        // HTTPエラー
        // --------------------------------------

        if (!response.ok) {

          throw new Error(
            'サーバーとの通信に失敗しました。'
          );
        }


        // --------------------------------------
        // JSON解析
        // --------------------------------------

        const result =
          await response.json();


        // --------------------------------------
        // GAS側エラー
        // --------------------------------------

        if (!result.success) {

          throw new Error(
            result.message ||
            '回答を保存できませんでした。'
          );
        }


        // --------------------------------------
        // 保存成功
        // --------------------------------------

        showToast(
          '回答を保存しました！'
        );


        // --------------------------------------
        // 最新状態を再取得
        // --------------------------------------

        await loadData();


        /*
         * ここでは liff.closeWindow() を
         * 実行しません。
         *
         * 回答後もそのまま画面に残り、
         * 「自分の回答」と
         * 「現在の参加者状況」を
         * 確認できるようにします。
         */


      } catch (error) {

        console.error(
          '回答送信エラー:',
          error
        );


        showError(
          getUserFriendlyErrorMessage(error)
        );


      } finally {

        isSubmitting = false;

        setVoteButtonsDisabled(
          false
        );

      }

    }


    // ==========================================
    // UI描画
    // ==========================================

    function renderUI(data) {

      // --------------------------------------
      // ローディング終了
      // --------------------------------------

      document.getElementById(
        'loading'
      ).style.display = 'none';


      document.getElementById(
        'error'
      ).style.display = 'none';


      document.getElementById(
        'main-content'
      ).style.display = 'block';


      // --------------------------------------
      // 自分の回答
      // --------------------------------------

      const statusEl =
        document.getElementById(
          'my-status'
        );


      if (
        data.myStatus === '参加'
      ) {

        statusEl.className =
          'status-badge status-attend';

        statusEl.innerText =
          `参加 (${data.myCount}名)`;


      } else if (
        data.myStatus === '不参加'
      ) {

        statusEl.className =
          'status-badge status-absent';

        statusEl.innerText =
          '不参加';


      } else {

        statusEl.className =
          'status-badge status-none';

        statusEl.innerText =
          '未回答';
      }


      // --------------------------------------
      // 全体集計
      // --------------------------------------

      document.getElementById(
        'summary-text'
      ).innerText =

        `総参加人数: ${data.totalHeadCount}名 ` +
        `(${data.totalGroups}組) / ` +
        `不参加: ${data.absentGroupCount}組`;


      // --------------------------------------
      // 参加者一覧
      // --------------------------------------

      const listEl =
        document.getElementById(
          'attendee-list'
        );


      listEl.innerHTML = '';


      if (
        !data.attendeeList ||
        data.attendeeList.length === 0
      ) {

        const empty =
          document.createElement(
            'div'
          );

        empty.style.fontSize =
          '0.85rem';

        empty.style.color =
          '#888';

        empty.textContent =
          '現在の参加予定者はいません';

        listEl.appendChild(
          empty
        );


        return;
      }


      // --------------------------------------
      // 参加者一覧生成
      // --------------------------------------

      data.attendeeList.forEach(
        item => {

          const div =
            document.createElement(
              'div'
            );

          div.className =
            'attendee-item';


          const name =
            document.createElement(
              'span'
            );

          name.textContent =
            item.name;


          const count =
            document.createElement(
              'strong'
            );

          count.textContent =
            `${item.count}名`;


          div.appendChild(
            name
          );

          div.appendChild(
            count
          );


          listEl.appendChild(
            div
          );

        }
      );

    }


    // ==========================================
    // ボタン無効化
    // ==========================================

    function setVoteButtonsDisabled(
      disabled
    ) {

      document
        .querySelectorAll(
          '.vote-button'
        )
        .forEach(
          button => {
            button.disabled =
              disabled;
          }
        );

    }


    // ==========================================
    // トースト表示
    // ==========================================

    function showToast(
      message
    ) {

      const toast =
        document.getElementById(
          'toast'
        );


      toast.innerText =
        message;


      toast.style.display =
        'block';


      setTimeout(
        () => {

          toast.style.display =
            'none';

        },
        2000
      );

    }


    // ==========================================
    // エラー表示
    // ==========================================

    function showError(
      message
    ) {

      document.getElementById(
        'loading'
      ).style.display =
        'none';


      document.getElementById(
        'main-content'
      ).style.display =
        'none';


      const errorEl =
        document.getElementById(
          'error'
        );


      const messageEl =
        document.getElementById(
          'error-message'
        );


      messageEl.innerText =
        message;


      errorEl.style.display =
        'block';

    }


    // ==========================================
    // ユーザー向けエラーメッセージ
    // ==========================================

    function getUserFriendlyErrorMessage(
      error
    ) {

      if (!error) {

        return (
          '予期しないエラーが発生しました。'
        );
      }


      const message =
        error.message ||
        String(error);


      // --------------------------------------
      // GASから返ってくる既知のエラー
      // --------------------------------------

      if (
        message.includes(
          'ユーザー認証情報'
        )
      ) {

        return (
          'LINEのユーザー認証に失敗しました。' +
          '\nLINEアプリからもう一度開いてください。'
        );
      }


      if (
        message.includes(
          'LINEユーザー認証に失敗'
        )
      ) {

        return (
          'LINEのユーザー認証に失敗しました。' +
          '\nページを閉じて、もう一度お試しください。'
        );
      }


      if (
        message.includes(
          '開催日の形式'
        )
      ) {

        return (
          '開催日の情報が正しくありません。'
        );
      }


      if (
        message.includes(
          '存在しない開催日'
        )
      ) {

        return (
          '開催日の情報が正しくありません。'
        );
      }


      if (
        message.includes(
          '参加人数'
        )
      ) {

        return (
          '参加人数の指定が正しくありません。'
        );
      }


      if (
        message.includes(
          '不参加'
        )
      ) {

        return (
          '出欠情報の指定が正しくありません。'
        );
      }


      if (
        message.includes(
          'アクセスが集中'
        )
      ) {

        return (
          '現在アクセスが集中しています。' +
          '\n少し待ってからもう一度お試しください。'
        );
      }


      if (
        message.includes(
          '通信'
        ) ||
        message.includes(
          'Failed to fetch'
        )
      ) {

        return (
          'サーバーとの通信に失敗しました。' +
          '\n電波の良い場所で、もう一度お試しください。'
        );
      }


      // --------------------------------------
      // その他
      // --------------------------------------

      return (
        message ||
        '処理中にエラーが発生しました。' +
        '\n時間をおいてもう一度お試しください。'
      );

    }


    // ==========================================
    // デフォルト開催日
    //
    // 毎週金曜日
    // ==========================================

    function getDefaultTargetDate() {

      const d =
        new Date();


      const day =
        d.getDay();


      // 金曜日 = 5
      const diff =
        (5 - day + 7) % 7 || 7;


      d.setDate(
        d.getDate() + diff
      );


      const yyyy =
        d.getFullYear();


      const mm =
        String(
          d.getMonth() + 1
        ).padStart(
          2,
          '0'
        );


      const dd =
        String(
          d.getDate()
        ).padStart(
          2,
          '0'
        );


      return (
        `${yyyy}-${mm}-${dd}`
      );

    }

  </script>
